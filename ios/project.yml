name: ForrestVoice
options:
  bundleIdPrefix: com.forrest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ForrestVoice:
    type: application
    platform: iOS
    sources:
      - path: ForrestVoice
        excludes:
          - Info.plist
        createsGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.forrest.voice
      INFOPLIST_FILE: ForrestVoice/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_ENTITLEMENTS: ForrestVoice/ForrestVoice.entitlements
      DEVELOPMENT_TEAM: RBT866NCF2
